name: BIST Avci Otomatik Tarama

on:
  schedule:
    # Türkiye saati ile hafta içi her gün seans saatlerinde çalışır (UTC saatine göre ayarlanmıştır)
    - cron: '30 6,9,12,14 * * 1-5'
  workflow_dispatch:  # İstersen GitHub panelinden manuel tetikleyebilmeni sağlar

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pytz requests

      - name: Avci Scriptini Çalıştır
        env:
          FORCE_RUN: "false"  # Normal seans kontrolü ile çalışır
        run: |
          python avci.py
