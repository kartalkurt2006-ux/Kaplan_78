name: BIST Avci Otomatik Tarama

on:
  schedule:
    # Türkiye saati ile hafta içi 09:30 - 18:00 arası her 15 dakikada bir çalışır (UTC ayarlı)
    - cron: '*/15 6-15 * * 1-5'
  workflow_dispatch:  # Manuel tetikleme desteği

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pytz requests

      - name: Avci Scriptini Çalıştır
        env:
          # Manuel tetiklendiğinde saat/seans engelini aşar, otomatikte normal seansa uyar
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python avci.py

      - name: Hafıza Dosyasını Güncelle ve Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch borsa_hafiza_v2.json
          git add borsa_hafiza_v2.json
          git commit -m "Otomatik hafıza güncellemesi [skip ci]" || echo "Değişiklik yok"
          git pull origin main --rebase || echo "Pull atlanıyor"
          git push origin main || echo "Push atlanıyor"
